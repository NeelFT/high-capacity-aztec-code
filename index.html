<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HCAC-OFT</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest">
  <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-180.png">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #000; color: #fff; }
    main { display: grid; justify-items: center; gap: 12px; padding: 20px; }
    .tabs, .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    button, input { min-height: 38px; padding: 7px 12px; border-radius: 6px; font: inherit; }
    button { border: 0; background: #fff; color: #000; cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .tabs button { background: #252525; color: #fff; }
    .tabs button.active { background: #fff; color: #000; }
    .panel { width: min(100%, 760px); display: grid; justify-items: center; gap: 10px; }
    .meta { min-height: 22px; text-align: center; }
    .subtle { color: #aaa; font-size: .9rem; }
    h1 { margin: 0; font-size: 1.5rem; }
    #receiveStatus[data-scan-state] { display: flex; align-items: center; justify-content: center; gap: 8px; }
    #receiveStatus[data-scan-state]::before { width: 10px; height: 10px; border-radius: 50%; background: #e6b422; content: ""; flex: 0 0 10px; }
    #receiveStatus[data-scan-state="detected"]::before { background: #43d17d; }
    #receiveStatus[data-scan-state="receiving"]::before { background: #63a8ff; }
    #tx { display: block; width: min(92vw, 570px); height: min(92vw, 570px); max-width: 100%; background: #fff; image-rendering: pixelated; }
    #cameraPreview { position: relative; width: min(100%, 720px); background: #111; }
    #camera { display: block; width: 100%; max-height: 65vh; object-fit: contain; }
    #cameraOverlay { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    #cameraOverlay polygon { fill: none; stroke: #d3aa3c; stroke-width: 1.25; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    #cameraOverlay[data-scan-state="detected"] polygon { stroke: #54c987; }
    #cameraOverlay[data-scan-state="receiving"] polygon { stroke: #75aef5; }
    #cameraBullseye { fill: none; stroke: #75e1c0; stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    #cameraReadout { position: absolute; top: 10px; left: 10px; display: grid; gap: 2px; padding: 6px 8px; border: 1px solid rgb(255 255 255 / 14%); border-radius: 4px; background: rgb(0 0 0 / 48%); color: rgb(255 255 255 / 78%); font: 11px/1.35 ui-monospace, monospace; pointer-events: none; }
    #receiveProgress { width: min(100%, 460px); height: 12px; accent-color: #43d17d; }
    #receivePreview img, #receivePreview video { max-width: min(100%, 480px); max-height: 55vh; }
    #scanCanvas { display: none; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>HCAC-OFT</h1>
    <p class="subtle">Install from your browser menu: choose <strong>Install app</strong> or <strong>Add to Home Screen</strong>.</p>
    <nav class="tabs" aria-label="Transfer mode">
      <button id="sendTab" class="active" type="button" aria-selected="true">Send</button>
      <button id="receiveTab" type="button" aria-selected="false">Receive</button>
    </nav>
    <section id="sendPanel" class="panel" aria-labelledby="sendTab">
      <div class="controls">
        <input type="file" id="fileInput" aria-label="Choose file">
        <button id="sendButton" type="button" disabled>Send</button>
      </div>
      <div id="sendStatus" class="meta">Choose a file</div>
      <div id="sendFileName" class="meta"></div>
      <div id="sendFileDetails" class="meta subtle" aria-live="polite"></div>
      <canvas id="tx" aria-label="Current transfer image"></canvas>
    </section>

    <section id="receivePanel" class="panel" aria-labelledby="receiveTab" hidden>
      <div id="cameraPreview">
        <video id="camera" playsinline muted></video>
        <svg id="cameraOverlay" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
          <polygon id="cameraOutline" visibility="hidden"></polygon>
          <polygon id="cameraBullseye" visibility="hidden"></polygon>
        </svg>
        <div id="cameraReadout" aria-hidden="true">
          <span id="cameraReadoutState">SEARCHING</span>
          <span id="cameraReadoutCounts">QR 0 · DATA 0/—</span>
        </div>
      </div>
      <label for="zoomSlider">Camera zoom
        <input id="zoomSlider" type="range" min="1" max="1" step="0.1" value="1" disabled>
      </label>
      <button id="startButton" type="button">Start camera</button>
      <div id="receiveStatus" class="meta" role="status" aria-live="polite">Ready to scan. Point the camera at the sender and tap Start camera.</div>
      <progress id="receiveProgress" max="1" value="0" aria-label="Recovered data blocks" hidden></progress>
      <div id="receiveProgressText" class="meta" aria-live="polite">Waiting to detect a QR code.</div>
      <div id="zoomHelp" class="meta"></div>
      <div id="receiveFileName" class="meta"></div>
      <div id="transferComplete" class="meta complete" hidden>Transfer Complete</div>
      <button id="exportFileButton" type="button" hidden>Save or share file</button>
      <div id="receivePreview"></div>
    </section>
  </main>
  <canvas id="scanCanvas"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
